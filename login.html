<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Member Sign In | StudyNest</title>
  <meta name="description" content="Sign in to your StudyNest member account to reserve quiet study rooms and manage your bookings.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>

<body data-page="login">
  <div class="auth-layout">
    <div class="auth-container">
      <div class="auth-controls">
        <button class="auth-toggle-btn rtl-toggle" type="button" aria-label="Toggle RTL mode" title="Toggle RTL / LTR"><span>RTL</span></button>
        <button class="auth-toggle-btn dark-toggle" type="button" aria-label="Toggle dark mode" title="Toggle Dark Mode">
          <i data-lucide="moon"></i>
        </button>
      </div>

      <!-- Auth Card -->
      <div class="auth-card">
        <!-- Logo at Top of Form -->
        <a href="index.html" class="auth-card__logo" aria-label="StudyNest Home">
          <svg viewBox="0 0 32 32" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 26V10a2 2 0 0 1 2-2h6l2 2 2-2h6a2 2 0 0 1 2 2v16"/>
            <path d="M16 10v16"/>
            <path d="M10 4q6-3 12 0"/>
          </svg>
          <span>StudyNest</span>
        </a>

        <h1 class="auth-card__title">Member Sign In</h1>
        <p class="auth-card__subtitle">Enter your credentials to access study room passes &amp; PIN codes</p>

        <form class="auth-form" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
          <div class="auth-form__group">
            <label class="form-label">Member ID or Email</label>
            <input type="text" class="form-input" placeholder="e.g. MBR-8841 or alex@example.com" value="MBR-8841" required>
          </div>

          <div class="auth-form__group">
            <label class="form-label">Password</label>
            <div class="password-input-group">
              <input type="password" class="form-input" placeholder="••••••••" value="password123" required>
              <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility" onclick="togglePasswordVisibility(this)">
                <i data-lucide="eye"></i>
              </button>
            </div>
          </div>

          <div class="auth-form__row">
            <label class="auth-form__checkbox">
              <input type="checkbox" checked>
              <span>Remember me</span>
            </label>
            <a href="#" class="auth-form__link" onclick="alert('Password reset link has been sent to your registered email.'); return false;">Forgot Password?</a>
          </div>

          <button type="submit" class="btn btn--primary btn--full" style="height: 2.875rem;">
            <span>Sign In to Dashboard</span>
            <i data-lucide="arrow-right"></i>
          </button>
        </form>

        <div class="auth-divider">Or continue with</div>

        <div class="auth-socials">
          <button type="button" class="btn-social" onclick="window.location.href='dashboard.html';">
            <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>Google</span>
          </button>
          <button type="button" class="btn-social" onclick="window.location.href='dashboard.html';">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.32c.67-.82 1.13-1.96.99-3.12-1 .04-2.22.67-2.92 1.49-.63.73-1.18 1.89-1.03 3.03 1.12.09 2.29-.58 2.96-1.4"/>
            </svg>
            <span>Apple</span>
          </button>
        </div>

        <div class="auth-card__footer">
          Don't have a member account? <a href="signup.html">Join Membership / Register</a>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>

</html>
